<svg viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VRChat AI 聊天机器人工作流程：说话 -> VAD -> STT -> LLM 人设 -> OSC -> 聊天框">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景网格 -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <path d="M 0 40 H 1200 M 0 80 H 1200 M 0 120 H 1200 M 0 160 H 1200 M 0 200 H 1200 M 0 240 H 1200 M 0 280 H 1200"/>
    <path d="M 60 0 V 320 M 120 0 V 320 M 180 0 V 320 M 240 0 V 320 M 300 0 V 320 M 360 0 V 320 M 420 0 V 320 M 480 0 V 320 M 540 0 V 320 M 600 0 V 320 M 660 0 V 320 M 720 0 V 320 M 780 0 V 320 M 840 0 V 320 M 900 0 V 320 M 960 0 V 320 M 1020 0 V 320 M 1080 0 V 320 M 1140 0 V 320"/>
  </g>

  <!-- 标题区 -->
  <text x="48" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">VRChat AI 聊天</text>
  <text x="50" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#94a3b8">在 VR 里说话 → AI 按人设回复 → OSC 写入游戏聊天框</text>
  <rect x="48" y="132" width="230" height="4" rx="2" fill="url(#titleGrad)"/>
  <text x="50" y="170" font-family="Consolas, monospace" font-size="13" fill="#64748b">分层架构 · 8 种设计模式 · 99 tests</text>

  <!-- 流程节点（双矩形） -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <!-- 1. 语音输入 -->
    <rect x="340" y="60" width="118" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="340" y="60" width="118" height="64" rx="10" fill="#38bdf8" opacity="0.14"/>
    <text x="399" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#7dd3fc">🎙️ 你说话</text>
    <text x="399" y="112" text-anchor="middle" font-size="11" fill="#64748b">F8 麦克风 / loopback</text>

    <!-- 2. VAD -->
    <rect x="492" y="60" width="118" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="492" y="60" width="118" height="64" rx="10" fill="#34d399" opacity="0.14"/>
    <text x="551" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#6ee7b7">🔊 VAD 切段</text>
    <text x="551" y="112" text-anchor="middle" font-size="11" fill="#64748b">Silero V5 · 抗音乐</text>

    <!-- 3. STT -->
    <rect x="644" y="60" width="128" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="644" y="60" width="128" height="64" rx="10" fill="#fbbf24" opacity="0.14"/>
    <text x="708" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#fcd34d">📝 STT 转写</text>
    <text x="708" y="112" text-anchor="middle" font-size="11" fill="#64748b">Edge 云 / whisper 本地</text>

    <!-- 4. LLM -->
    <rect x="806" y="60" width="128" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="806" y="60" width="128" height="64" rx="10" fill="#f472b6" opacity="0.16"/>
    <text x="870" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#f9a8d4">🤖 LLM 人设</text>
    <text x="870" y="112" text-anchor="middle" font-size="11" fill="#64748b">DeepSeek · 角色卡驱动</text>

    <!-- 5. OSC -->
    <rect x="968" y="60" width="110" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="968" y="60" width="110" height="64" rx="10" fill="#a78bfa" opacity="0.16"/>
    <text x="1023" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#c4b5fd">📡 OSC</text>
    <text x="1023" y="112" text-anchor="middle" font-size="11" fill="#64748b">UDP :9000</text>

    <!-- 6. 聊天框 -->
    <rect x="806" y="190" width="272" height="76" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="806" y="190" width="272" height="76" rx="12" fill="#38bdf8" opacity="0.08"/>
    <text x="942" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#7dd3fc">💬 VRChat 聊天框</text>
    <text x="942" y="248" text-anchor="middle" font-size="12" fill="#94a3b8">小星：诶嘿，蔬菜我不挑食啦，</text>
    <text x="942" y="264" text-anchor="middle" font-size="12" fill="#94a3b8">但最爱还是薯条和炸鸡！</text>

    <!-- 箭头 -->
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M 458 92 H 490"/>
      <path d="M 610 92 H 642"/>
      <path d="M 772 92 H 804"/>
      <path d="M 934 124 V 158"/>
      <path d="M 1023 124 V 188"/>
      <path d="M 934 158 H 1023"/>
    </g>
  </g>
</svg>
